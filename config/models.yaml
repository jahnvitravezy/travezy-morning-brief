# Allowlist of models any agent or judge may use. family is used to test judge self-preference.
# end_of_life: the provider's retirement date. The service warns 90 days ahead (log and /health).
# Exact versions only (no "-latest" aliases), so a comparison can't change underneath us.
openai/gpt-4o:                  { family: openai, end_of_life: 2027-01-01 }      # production baseline; retires Jan 2027
openai/gpt-4o-mini:             { family: openai }      # judge starting point (the brief's)
openai/gpt-4.1-mini:            { family: openai, end_of_life: 2027-01-01 }      # retires Jan 2027
openai/gpt-4.1:                 { family: openai, end_of_life: 2027-01-01 }      # retires Jan 2027
openai/gpt-5-mini:              { family: openai, temperature: false }           # replacement candidate
anthropic/claude-sonnet-5-5:    { family: anthropic, temperature: false, structured: json }   # rejects temperature=0 and forced tool use
anthropic/claude-haiku-5-5:     { family: anthropic, temperature: false }
gemini/gemini-3.8-flash:        { family: google }
gemini/gemini-3.5-flash-lite:   { family: google }
# Stand-in reviewers (stronger models), only to check our judges until Travezy's own reviewer verdicts arrive.
anthropic/claude-opus-5-5:      { family: anthropic, temperature: false, structured: json }
openai/gpt-5:                   { family: openai, temperature: false }
