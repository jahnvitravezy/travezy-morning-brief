# USD per call at Google's India pricing (developers.google.com/maps/billing-and-pricing/pricing-india),
# checked 3 Nov 2026. Free monthly allowances are in config/free_allowance.yaml (the cost report deducts them).
google_places_text_search_ids: 0.0       # Text Search Essentials (IDs only): free, unlimited; finds a place once
google_places_text_search: 0.0105        # Text Search Enterprise: $10.50 / 1,000; used for "ideas near here" (5 places per call)
google_places_details: 0.006             # Place Details Enterprise (hours, rating): $6.00 / 1,000; one place, refreshed on a schedule
google_routes_matrix_element: 0.0015     # Compute Route Matrix Essentials: $1.50 / 1,000
tavily_search: 0.008                     # Tavily basic search, pay as you go
weatherapi_forecast: 0.0                 # WeatherAPI.com: within the plan
open_meteo_forecast: 0.0                 # kept for the old adapter
