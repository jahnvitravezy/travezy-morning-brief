# A second rubric for the same judge: stricter, for launch. Switching is one line in agents.yaml
# (mb.judge.v1 -> rubric: rubric.morning_brief_launch.v1) or one flag (judge_run --rubric ...).
# Nothing in the code changes: weights, cut-offs, rule checks and fix attempts all live here.
id: rubric.morning_brief_launch.v1
use_case: morning_brief
judge_model: openai/gpt-4o-mini
temperature: 0
scale: "0-100"
badge: { green: 90, amber: 70 }   # placeholders: set from agreement with the Travezy reviewer
max_fix_attempts: 1
rule_checks:
  notification_title_max_chars: 35   # tighter for small lock screens
  notification_body_max_chars: 80
  max_surprises: 2                   # fewer, better ideas
  surprise_needs_source_or_place_id: true
  all_fields_present: true
criteria:
  # Accuracy weighs more at launch: a wrong fact costs more trust than a dull sentence.
  - { id: accuracy,    weight: 0.40, asks: "Are places, times, prices, hours and diets correct against the inputs?" }
  - { id: relevance,   weight: 0.20, asks: "Does it fit this trip's preferences and this day?" }
  - { id: feasibility, weight: 0.25, asks: "Can the traveller do everything it suggests in the time and distance shown?" }
  - { id: format,      weight: 0.05, asks: "Does it meet the output contract?" }
  - { id: tone,        weight: 0.10, asks: "Is it decisive, honest and short?" }
