services:
  api:
    build: .
    env_file: .env                 # keys stay on the machine, never in the image
    environment:
      DATABASE_URL: postgresql://mb:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/mb   # the outbox lives in Postgres
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mb
      POSTGRES_DB: mb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}   # no default: production reads it from secrets
    volumes:
      - pgdata:/var/lib/postgresql/data                   # briefs survive restarts and rebuilds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mb -d mb"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
